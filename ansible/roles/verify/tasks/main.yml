---
- name: Verify Key Binaries
  ansible.builtin.shell: "command -v {{ item | quote }}"
  loop:
    - niri
    - qs
    - xwayland-satellite
    - hyprlock
    - ghostty
    - fnm
    - bun
    - rustup
    - python
    - tailscale
    - docker
    - rclone
  changed_when: false
  tags: verify

- name: Check Configuration Files
  stat:
    path: "{{ ansible_user_dir }}/{{ item }}"
  loop:
    - .config/niri/config.kdl
    - .config/quickshell/dofs/shell.qml
    - .config/quickshell/dofs/bar/config.json
    - .config/quickshell/dofs/notifications/config.json
  register: config_stats
  tags: verify

- name: Verify Configuration Files Exist
  assert:
    that: item.stat.exists
    fail_msg: "Config file {{ item.item }} is missing from {{ ansible_user_dir }}/"
  loop: "{{ config_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: verify

- name: Verify Service Status
  systemd:
    name: "{{ item }}"
    state: started
  loop:
    - firewalld
    - docker
    - libvirtd
  ignore_errors: true
  changed_when: false
  tags: verify
