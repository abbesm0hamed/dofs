---
- name: Install Desktop Utilities
  block:
    - name: Install FileZilla
      dnf:
        name: filezilla
        state: present
      become: true

    - name: Verify FileZilla installation
      command: filezilla --version
      register: filezilla_version
      changed_when: false
      failed_when: false

    - name: Display FileZilla version
      debug:
        msg: "FileZilla version: {{ filezilla_version.stdout }}"

    - name: Add AnyDesk repository
      yum_repository:
        name: anydesk
        description: AnyDesk Fedora - stable
        baseurl: http://rpm.anydesk.com/fedora/$basearch/
        gpgcheck: yes
        repo_gpgcheck: yes
        gpgkey: https://keys.anydesk.com/repos/RPM-GPG-KEY
      become: true

    - name: Install AnyDesk
      dnf:
        name: anydesk
        state: present
      become: true

    - name: Verify AnyDesk installation
      command: anydesk --version
      register: anydesk_version
      changed_when: false
      failed_when: false

    - name: Display AnyDesk version
      debug:
        msg: "AnyDesk version: {{ anydesk_version.stdout | default('Not found') }}"

- name: Setup Cursors
  tags: cursors
  block:
    - name: Create icons directory
      file:
        path: "{{ banana_cursor_icons_dir }}"
        state: directory
        mode: "0755"

    - name: Read installed Banana cursor version
      slurp:
        src: "{{ banana_cursor_version_file }}"
      register: banana_cursor_installed
      failed_when: false

    - name: Install Banana cursor
      when: >-
        banana_cursor_installed.content is not defined or
        (banana_cursor_installed.content | b64decode | trim) != banana_cursor_version
      block:
        - name: Remove existing Banana cursor temporary directory
          file:
            path: /tmp/Banana
            state: absent

        - name: Create Banana cursor temporary directory
          file:
            path: /tmp/Banana
            state: directory
            mode: "0755"

        - name: Download Banana cursor archive
          get_url:
            url: "{{ banana_cursor_url }}"
            dest: /tmp/Banana/Banana.tar.xz
            mode: "0644"

        - name: Extract Banana cursor archive
          unarchive:
            src: /tmp/Banana/Banana.tar.xz
            dest: /tmp/Banana
            remote_src: yes

        - name: Remove previously installed Banana cursor
          file:
            path: "{{ banana_cursor_dir }}"
            state: absent

        - name: Install Banana cursor files
          copy:
            src: /tmp/Banana/Banana
            dest: "{{ banana_cursor_icons_dir }}/"
            remote_src: yes

        - name: Record installed Banana cursor version
          copy:
            content: "{{ banana_cursor_version }}\n"
            dest: "{{ banana_cursor_version_file }}"
            mode: "0644"

- name: Setup GTK theme
  block:
    - name: Install adw-gtk3 theme
      dnf:
        name: adw-gtk3-theme
        state: present
      become: true

    - name: Apply adw-gtk3 GTK theme (GNOME)
      command: gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"
      changed_when: false

    - name: Prefer light color scheme (GNOME)
      command: gsettings set org.gnome.desktop.interface color-scheme "prefer-light"
      changed_when: false

    - name: Apply Banana cursor theme (GNOME)
      command: gsettings set org.gnome.desktop.interface cursor-theme "Banana"
      changed_when: false
      tags: cursors

    - name: Set cursor size (GNOME)
      command: gsettings set org.gnome.desktop.interface cursor-size 18
      changed_when: false
      tags: cursors

- name: Gaming optimizations
  block:
    - name: Ensure applications directory exists
      file:
        path: "{{ ansible_user_dir }}/.local/share/applications"
        state: directory
    - name: Patch Steam desktop entry
      copy:
        src: /usr/share/applications/steam.desktop
        dest: "{{ ansible_user_dir }}/.local/share/applications/steam.desktop"
        remote_src: yes
    - name: Add Steam flags
      replace:
        path: "{{ ansible_user_dir }}/.local/share/applications/steam.desktop"
        regexp: '^Exec=/usr/bin/steam %U'
        replace: 'Exec=/usr/bin/steam -system-composer -no-cef-sandbox %U'

- name: Multimedia setup
  block:
    - name: Start v4l2-relayd for camera
      systemd:
        name: v4l2-relayd
        enabled: yes
        state: started
      become: true
      ignore_errors: true
    - name: Unmute microphone
      command: wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0
      changed_when: false
      ignore_errors: true


- name: Configure PAM for Hyprlock
  copy:
    src: hyprlock.pam
    dest: /etc/pam.d/hyprlock
    mode: '0644'
  become: true
