[defaults]
inventory = inventory
stdout_callback = ansible.builtin.default
display_skipped_hosts = no
connection = local
deprecation_warnings = False
interpreter_python = auto_silent
timeout = 60

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
